name: Build, Test, and Push

on:
  push:
    branches: [main]

jobs:
  # ---------- STAGE 1: BUILD ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile the project
        run: mvn -B compile

  # ---------- STAGE 2: TEST ----------
  test:
    needs: build   # only starts if the "build" job above succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: mvn -B test

  # ---------- STAGE 3: PUSH (build the image + publish it) ----------
  middl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: testing for myself
        run: echo "Hello Divine Mercy sa buhay ni sister Faustina"

  push:
    needs: test   # only starts if "test" also succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/bff-demo:latest .

      - name: Push the image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/bff-demo:latest